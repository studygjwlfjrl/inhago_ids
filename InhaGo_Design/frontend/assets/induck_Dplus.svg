
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 180"
     role="img"
     aria-label="D+ 학점의 울먹이는 인덕이">

  <defs>
    <linearGradient id="hood" x2="1" y2="1">
      <stop stop-color="#367ef2"/>
      <stop offset="1" stop-color="#123e99"/>
    </linearGradient>
  </defs>

  <!-- 그림자 -->
  <ellipse cx="80" cy="168" rx="55" ry="8"
           fill="#9bb9d9" opacity=".35"/>

  <!-- 파란 몸통 -->
  <path d="M35 111Q26 74 42 52Q56 24 80 27Q112 22 125 54Q142 80 125 116L135 150Q80 172 25 150Z"
        fill="url(#hood)" stroke="#194b9e" stroke-width="3"/>

  <!-- 흰 얼굴 -->
  <path d="M44 62Q47 39 81 40Q116 39 119 70Q122 109 83 123Q41 121 40 86Z"
        fill="#fffdf4"/>

  <!-- 슬프게 처진 눈썹 -->
  <path d="M50 71Q56 67 65 79"
        fill="none" stroke="#1c3153"
        stroke-width="3.5" stroke-linecap="round"/>

  <path d="M96 79Q105 67 111 71"
        fill="none" stroke="#1c3153"
        stroke-width="3.5" stroke-linecap="round"/>

  <!-- 울먹이는 눈 -->
  <ellipse cx="59" cy="85" rx="6" ry="7"
           fill="#1c3153"/>
  <ellipse cx="102" cy="85" rx="6" ry="7"
           fill="#1c3153"/>

  <!-- 눈에 맺힌 눈물 -->
  <ellipse cx="61" cy="88" rx="2" ry="2.5"
           fill="#b8e9ff"/>
  <ellipse cx="104" cy="88" rx="2" ry="2.5"
           fill="#b8e9ff"/>

  <!-- 분홍 볼 -->
  <ellipse cx="49" cy="101" rx="11" ry="6"
           fill="#ffb7bc" opacity=".8"/>
  <ellipse cx="111" cy="101" rx="11" ry="6"
           fill="#ffb7bc" opacity=".8"/>

  <!-- 노란 부리 -->
  <path d="M69 93Q80 84 92 93Q82 109 80 108Q77 107 69 93Z"
        fill="#ffbb25" stroke="#ee9c17" stroke-width="2"/>

  <!-- 울먹이는 입 -->
  <path d="M75 104Q80 96 85 104"
        fill="none" stroke="#b96a24"
        stroke-width="2.5" stroke-linecap="round"/>

  <!-- 머리 장식 -->
  <path d="M67 29Q73 14 80 20Q86 7 94 20Q103 12 106 30"
        fill="#1d58b8" stroke="#1d58b8"
        stroke-linecap="round" stroke-width="7"/>

  <!-- 이마의 D+ 학점 -->
  <rect x="65" y="47" width="30" height="20"
        rx="4" fill="#ffffff"
        stroke="#d83c29" stroke-width="2"/>

  <text x="80" y="61"
        font-size="13" font-weight="900"
        font-family="sans-serif"
        text-anchor="middle" fill="#c92c20">D+</text>

  <!-- 양쪽 팔 -->
  <path d="M36 119Q18 119 18 140Q20 153 37 145M123 119Q143 120 143 139Q141 150 125 144"
        fill="#fffdf4" stroke="#d8e7fa" stroke-width="3"/>

  <!-- INHA 글씨 -->
  <text x="80" y="148"
        font-size="16" font-weight="900"
        font-family="sans-serif"
        text-anchor="middle" fill="white">INHA</text>

</svg>
